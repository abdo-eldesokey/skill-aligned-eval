[project]
name = "skill-aligned-eval"
version = "0.1.0"
description = "Skill-aligned annotation framework for evaluating text-to-image models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
dependencies = [
    "instructor>=1.6",
    "openai>=1.50",
    "openai-agents>=0.0.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "runware>=0.4",
    "aiohttp>=3.9",
    "tiktoken>=0.7",
    "requests>=2.31",
    "pillow>=10",
    "gdown>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "analysis", "scripts", "utils"]

[tool.uv]
package = false
